name: uth_smart_tasks
description: UTH SmartTasks - Firebase Login Flow
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase core
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  intl: ^0.19.0

  # Google Sign In
  google_sign_in: ^6.2.1

  # Internet checking
  connectivity_plus: ^5.0.2

  # HTTP (🆕 dùng cho API amock)
  http: ^1.2.0
  provider: ^6.0.5
  file_picker: ^6.1.1
  firebase_storage: ^11.6.0
  open_filex: ^4.4.0
  url_launcher: ^6.2.5


  # Cupertino icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
