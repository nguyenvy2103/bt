name: uth_smart_tasks
description: UTH SmartTasks - Firebase Login Flow
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2 # Cập nhật nhẹ

  # Firebase - Nâng cấp đồng bộ để tương thích với package 'web' của file_picker
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.3.0

  intl: ^0.19.0

  # Google Sign In
  google_sign_in: ^6.2.1

  # Internet checking
  connectivity_plus: ^6.1.0 # Cập nhật bản mới

  # HTTP & State Management
  http: ^1.2.0
  provider: ^6.1.2

  # File handling - Giữ bản mới để tránh lỗi Java Registrar
  file_picker: ^8.1.2
  open_filex: ^4.5.0
  url_launcher: ^6.3.1

  # Cupertino icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  # assets:
  #   - assets/images/